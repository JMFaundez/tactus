[general]
  case = "obsproc_example_@DA.OBS_PROVIDER@_@YMD_START@_@HH_START@"

[general.times]
  start = "2025-02-09T03:00:00Z"
  forecast_range = "PT3H"

[da.surface]
  active = false
  odbconverter = "Obsconvert"

[da.upper_air]
  active = true
  odbconverter = "Obsconvert"
  bator_window_len = "PT1H"
  bator_window_shift = "-PT30M"

[da.upper_air.oopsvar]
  background = "@CASEDIR@/bg_verification/@TASK.ARGS.CYCLE@/@MEMBER_STR@/ICMSHACRD+@TASK.ARGS.LEAD@"
  require_varbc = false
  archive_odb = true

[da.upper_air.oopsvar.oops_update.variational.iteration]
  ninner = "0"

[platform]
  obs_dir = "/scratch/sis/da/obs/@YYYY@/@MM@/@DD@"

[submission]
  #bindir = "/ec/project/accord/IAL/CY50t2/obsproc/R64/bin"
  #bindir_gl = "@SUBMISSION.BINDIR@"
  bindir = "/ec/res4/scratch/sis/install/pr/intel/bin/"
  precision = "R64"


[submission.task_exceptions.Forecast]
  bindir = "@SUBMISSION.BINDIR@"

[suite_control]
  suite_definition = "ObsprocSuiteDefinition"
